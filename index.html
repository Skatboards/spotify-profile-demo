<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>My Spotify Profile</title>
        <script src="src/script.ts" type="module"></script>
    </head>

    <body>
        <h1>Display your Spotify profile data</h1>

        <section id="login">
          <p>Log in with Spotify to view your profile and currently playing song.</p>
          <button id="loginButton" type="button">Log in with Spotify</button>
          <p id="loginStatus" aria-live="polite"></p>
        </section>

        <section id="profile" hidden>
          <h2>Logged in as <span id="displayName"></span></h2>

            <span id="avatar"></span>

              <ul>
                <li>User ID: <span id="id"></span></li>
                <li>Email: <span id="email"></span></li>
                <li>Spotify URI: <a id="uri" href="#"></a></li>
                <li>Link: <a id="url" href="#"></a></li>
                <li>Profile Image: <span id="imgUrl"></span></li>
              </ul>

              <button id="currentlyPlayingButton" type="button">
                Get currently playing song
              </button>
              <p id="currentlyPlaying" aria-live="polite"></p>

        </section>
    </body>

</html>
